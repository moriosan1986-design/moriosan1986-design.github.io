<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>見学みっけ | 工場見学・施設見学スポットを探せるアプリ</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
        background: #faf6f3;
        color: #2b211b;
        line-height: 1.8;
        max-width: 680px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      h1 {
        font-size: 24px;
        color: #8f3e20;
      }
      h2 {
        font-size: 16px;
        color: #8f3e20;
        margin-top: 32px;
      }
      p {
        font-size: 14.5px;
        color: #6e5e54;
      }
      ul {
        font-size: 14.5px;
        color: #6e5e54;
        padding-left: 22px;
      }
      li {
        margin-bottom: 6px;
      }
      a {
        color: #b5502b;
      }
      .lead {
        font-size: 15px;
        color: #6e5e54;
        margin-top: 8px;
      }
      .count {
        display: inline-block;
        margin-top: 8px;
        font-size: 13px;
        color: #8f3e20;
        background: #f3ded4;
        border-radius: 999px;
        padding: 4px 14px;
      }
      .store-badge {
        display: inline-block;
        margin-top: 24px;
      }
      .store-badge img {
        display: block;
        height: 40px;
        width: auto;
      }
      hr {
        margin-top: 40px;
        border: none;
        border-top: 1px solid #e5dad2;
      }
      .source-note {
        font-size: 12.5px;
        color: #6e5e54;
      }
      nav.footer-nav {
        margin-top: 24px;
        font-size: 13px;
      }
      nav.footer-nav a {
        margin-right: 16px;
      }
    </style>
  </head>
  <body>
    <h1>見学みっけ</h1>
    <p class="lead">全国の工場見学・施設見学スポットを探せるアプリ</p>
    <p class="count">掲載施設数: <span id="facility-count">82</span>件</p>

    <h2>主な特徴</h2>
    <ul>
      <li>公式サイトを確認して作成した情報を掲載</li>
      <li>現在地から近い順に並べ替え</li>
      <li>地図から探せる</li>
      <li>オフラインでも閲覧できる</li>
      <li>無料・予約不要などの条件で絞り込める</li>
    </ul>

    <a class="store-badge" href="https://apps.apple.com/jp/app/id6799468407">
      <img src="./assets/app-store-badge.svg" alt="Download on the App Store" />
    </a>

    <hr />
    <p class="source-note">
      出典：国土地理院ウェブサイト<br />
      （https://msearch.gsi.go.jp/address-search/AddressSearch）<br />
      本アプリの施設座標は、同ウェブサイトの住所検索機能により取得したデータをもとに編集して掲載しています。
    </p>
    <nav class="footer-nav">
      <a href="./privacy-policy.html">プライバシーポリシー</a>
      <a href="./support.html">サポート</a>
    </nav>
    <script>
      (function () {
        var BASE = './data/';
        fetch(BASE + 'version.json', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('version.json fetch failed');
            return res.json();
          })
          .then(function (version) {
            return fetch(BASE + 'facilities-' + version.dataVersion + '.json', { cache: 'no-store' }).then(
              function (res) {
                if (!res.ok) throw new Error('facilities json fetch failed');
                return res.json();
              },
            );
          })
          .then(function (facilities) {
            var el = document.getElementById('facility-count');
            if (el && Array.isArray(facilities)) {
              el.textContent = String(facilities.length);
            }
          })
          .catch(function () {
            // 取得失敗時はHTMLに直書きした初期値をそのまま表示する
          });
      })();
    </script>
  </body>
</html>
